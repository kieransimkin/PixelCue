[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcue"
version = "0.1.0"
description = "AI-assisted visual media scanner and tag browser with 4-bit JoyCaption caption tagging."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.4",
  "torch>=2.4",
  "transformers>=4.51,<5",
  "accelerate>=1.6",
  "bitsandbytes>=0.45",
  "av>=12",
  "python-magic>=0.4.27; platform_system != 'Windows'",
  "python-magic-bin>=0.4.14; platform_system == 'Windows'",
  "py7zr>=0.22",
  "rarfile>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pixelcue = "pixelcue.main:main"

[tool.setuptools.packages.find]
where = ["src"]
