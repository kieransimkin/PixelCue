[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcue"
version = "0.3.1"
description = "AI-assisted visual media scanner and tag browser with 4-bit JoyCaption caption tagging."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.4",
  "torch>=2.14.1",
  "transformers>=4.53",
  "accelerate>=1.6",
  "bitsandbytes>=0.45",
  "huggingface-hub>=0.30",
  "platformdirs>=4.2",
  "av>=12",
  "python-magic>=0.4.27; platform_system != 'Windows'",
  "python-magic-bin>=0.4.14; platform_system == 'Windows'",
  "py7zr>=0.22",
  "rarfile>=4.2",
]

[project.optional-dependencies]
faces = [
  "deepface>=0.0.95",
  "tensorflow==2.21.0",
  "tf-keras==2.21.0",
]
dev = ["pytest>=8"]

[project.scripts]
pixelcue = "pixelcue.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
