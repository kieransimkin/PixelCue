name: ThumbMoves CI

on:
  push:
    branches: ['**']
    paths:
      - 'packages/thumbmoves/**'
      - 'src/pixelcue/os_thumbnail.py'
      - 'tests/test_thumbmoves*.py'
      - 'pyproject.toml'
      - 'scripts/thumbmoves_release.py'
      - '.github/workflows/thumbmoves-*.yml'
  pull_request:
    paths:
      - 'packages/thumbmoves/**'
      - 'src/pixelcue/os_thumbnail.py'
      - 'tests/test_thumbmoves*.py'
      - 'pyproject.toml'
      - 'scripts/thumbmoves_release.py'
      - '.github/workflows/thumbmoves-*.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install ThumbMoves and test dependencies
        run: python -m pip install -e "./packages/thumbmoves[dev]"
      - name: Run standalone package tests
        run: python -m pytest -q packages/thumbmoves/tests
      - name: Run PixelCue integration-contract tests when present
        if: ${{ hashFiles('tests/test_thumbmoves.py', 'tests/test_thumbmoves_identity.py', 'tests/test_thumbmoves_library_split.py') != '' }}
        run: >-
          python -m pytest -q
          tests/test_thumbmoves.py
          tests/test_thumbmoves_identity.py
          tests/test_thumbmoves_library_split.py

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build verification tools
        run: python -m pip install build pytest twine
      - name: Build wheel and source distribution
        run: python -m build --outdir dist packages/thumbmoves
      - name: Validate identity, contents and package metadata
        run: |
          python scripts/thumbmoves_release.py source
          python -m pytest -q tests/test_thumbmoves_release.py
          python scripts/thumbmoves_release.py dist dist
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel outside the source tree
        shell: bash
        run: |
          VERSION=$(python scripts/thumbmoves_release.py source)
          python -m venv "$RUNNER_TEMP/thumbmoves-wheel"
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          "$RUNNER_TEMP/thumbmoves-wheel/bin/python" -m pip install "$WHEEL"
          cd "$RUNNER_TEMP"
          THUMBMOVES_VERSION="$VERSION" ./thumbmoves-wheel/bin/python -c \
            'import os, thumbmoves; assert thumbmoves.__version__ == os.environ["THUMBMOVES_VERSION"]; print(thumbmoves.backend_info())'
          ./thumbmoves-wheel/bin/thumbmoves --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thumbmoves-python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
