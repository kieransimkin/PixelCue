name: Live frame, MJPEG and screen OCR acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install pytest pillow numpy pytesseract
      - run: python -m pytest -q tests/test_live_analysis.py tests/test_stream_harness.py tests/test_screen_ocr.py --junitxml=artifacts/live-analysis.xml
      - name: Record completion assessment
        if: always()
        run: |
          echo 'Blogworthiness: FAIL. Routine persistent-session, real pipe and OCR fixture replay; source evidence is this CI job and JUnit.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-analysis-evidence
          path: artifacts/live-analysis.xml
